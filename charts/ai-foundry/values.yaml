# yaml-language-server: $schema=./values.schema.json
ai-foundry:
  url: "https://ai-foundry.mia-platform.test"
  isPaaS: false

  authzUrl: "https://home.mia-platform.test"
  catalogUrl: "https://catalog.mia-platform.test"

  authtoolBffUrl: "http://authtool-bff"
  catalogClientId: "catalog-api"
  authzClientId: "authz-api"
  # Audience of the token exchange towards the AI Services edge
  # (charts/ai-services): docling, memory and the AI gateway answer only a token
  # exchanged for it.
  aiServicesClientId: "ai-services-api"

  # Every service exports OTLP to the collector of AI Services
  # (charts/ai-services, `otelCollector`), which forwards traces to Langfuse and
  # metrics to Prometheus.
  telemetry:
    enabled: true
    otelExporterOtlpEndpoint: "http://otel-collector.ai-services.svc.cluster.local:4317"
    otelExporterOtlpProtocol: "grpc"

  ingressRoute:
    enabled: true

  authorizationServer:
    enabled: true
    issuer: "https://auth.mia-platform.test/realms/mia-realm"

  secrets:
    accessControlKeys:
      enabled: true
    adkBeAppKeys:
      enabled: true
    aiFoundryBeKeys:
      enabled: true
    aiFoundryBffKeys:
      enabled: true
    aiFoundryProvisionerKeys:
      enabled: true
    aiFoundryWorkflowsKeys:
      enabled: true
    authtoolBffKeys:
      enabled: true
    secretStoreServiceKeys:
      enabled: true
    workspaceServiceKeys:
      enabled: true

  # Seeds the Item Type Definitions and the default items (agents, tools,
  # MCP servers, ...) into every Catalog tenant. Signs in as the
  # `ai-foundry-provisioner` service account the realm creates, with the key
  # published by the serve workload at
  # /.well-known/ai-foundry-provisioner/jwks.json.
  aiFoundryProvisioner:
    clientId: "ai-foundry-provisioner"
    serve:
      enabled: true
    mcpServers:
      catalogMcpUrl: "https://catalog.mia-platform.test/mcp"
      servicesMcpUrl: "https://home.mia-platform.test/mcp"
      memoryMcpUrl: "https://ai-services.mia-platform.test/memory/mcp/"

  adkBeApp:
    config:
      # The runtime exports over OTLP/HTTP, to the same collector.
      otelExporterOtlpEndpoint: "http://otel-collector.ai-services.svc.cluster.local:4318"
      otelExporterOtlpProtocol: "http/protobuf"
      # Read back by the agents' observability tools: traces from Langfuse
      # (secrets.adkBeAppKeys.langfuseAuthHeader), metrics from AI Services'
      # Prometheus.
      langfuseBaseUrl: "http://langfuse-web.langfuse.svc.cluster.local:3000"
      prometheusBaseUrl: "http://prometheus.ai-services.svc.cluster.local"
      # Every model call goes through the AI gateway (LiteLLM) of AI Services.
      litellmProxyApiBase: "https://ai-services.mia-platform.test/ai-gateway/"
      agentMemoryBaseUrl: "https://ai-services.mia-platform.test"
      foundryIntrospectionTools: true
      allowPrivateNetworkMcp: true

  aiFoundryBe:
    config:
      # Admin API of the AI gateway: requires secrets.aiFoundryBeKeys.litellmAdminKey,
      # which is the LiteLLM master key of AI Services.
      litellmBaseUrl: "https://ai-services.mia-platform.test/ai-gateway/"
      # AI Traces, AI Metrics and Insights: traces from Langfuse
      # (secrets.aiFoundryBeKeys.langfuseAuthHeader), metrics from AI Services'
      # Prometheus (in-cluster, no credential).
      langfuseBaseUrl: "http://langfuse-web.langfuse.svc.cluster.local:3000"
      prometheusBaseUrl: "http://prometheus.ai-services.svc.cluster.local"

  aiFoundryBff:
    config:
      memoryBaseUrl: "https://ai-services.mia-platform.test"

  # Agentic Workflows: runs on the Temporal cluster deployed by AI Services.
  aiFoundryWorkflows:
    config:
      temporalAddress: "temporal-frontend.ai-services.svc.cluster.local:7233"
      # A *Temporal* namespace: must match `ai-services.temporal.namespaces`.
      temporalNamespace: "ai-services"

  # Stores the credentials AI Foundry manages (API credentials, gateway keys)
  # in an OpenBao/Vault KV v2 mount, signing in with an AppRole.
  secretStoreService:
    config:
      storeAddr: "http://openbao.openbao.svc.cluster.local:8200"
      storeKvMount: "kv"
      auth:
        method: "approle"

  apiGateway:
    docling:
      url: "https://ai-services.mia-platform.test/api/docling/"

  aiFoundryWebsite:
    resources:
      requests:
        cpu: "100m"
        memory: "150Mi"
      limits:
        cpu: "100m"
        memory: "150Mi"
    config:
      enabled: true
      links:
        consoleHref: "https://console.mia-platform.test"
        catalogHref: "https://catalog.mia-platform.test"
        homepageHref: "https://home.mia-platform.test"
        miaFlowHref: "https://flow.mia-platform.test"
        dataFabricHref: "https://data-fabric.mia-platform.test"
        p4samdHref: "https://p4samd.mia-platform.test"
        claudeCodeHref: "https://claude.ai/code"
        claudeCodeDocsHref: "https://code.claude.com/docs/en/discover-plugins#use-the-interactive-interface"
        claudeCodeSkillsDocsHref: "https://docs.anthropic.com/en/docs/claude-code/skills"
        claudeCodeTracesDocsHref: "https://code.claude.com/docs/en/monitoring-usage#traces-beta"
        githubCopilotHref: "https://github.com/features/copilot"
        githubCopilotCustomInstructionsHref: "https://docs.github.com/en/copilot/customizing-copilot/adding-repository-custom-instructions-for-github-copilot"
        miaDocsHref: "https://docs.mia-platform.eu/"
        vscodeDocsHref: "https://code.visualstudio.com/docs/agent-customization/agent-plugins"
        vscodeMonitoringDocsHref: "https://code.visualstudio.com/docs/agents/guides/monitoring-agents"
        jetbrainsDocsHref: "https://github.com/microsoft/copilot-intellij-feedback/wiki"
        jetbrainsTracesDocsHref: "https://github.com/microsoft/copilot-intellij-feedback/wiki/Monitoring-Agent-Usage-with-OpenTelemetry"
        kiroDocsHref: "https://kiro.dev/docs/customization/agent-plugins"
      otelServices:
        - "copilot-chat"
        - "claude-code"
        - "mia-ai-foundry"
        - "litellm"
        - "mia-flow"
        - "adk-be-app"
