{{- $secrets := .Files.Get ".local/secrets.yaml" | fromYaml }}
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-vault-secrets
type: Opaque
data:
  ## Keys follow the format <realm>_<key>. The realm prefix (before the
  ## first underscore) scopes the secret to a realm; the key (after it) is
  ## what realm YAML references as ${vault.<key>} — the realm prefix itself
  ## is not part of that reference. See docs/03-keycloak.md.
  ## MASTER
  #KEYCLOAK_CONFIG_CLI_CLIENT_SECRET
  master_keycloak-config-cli-client-secret: {{ "change_me" | b64enc }}
  # mia-realm_external-identity-provider-client-secret: {{ $secrets.clientSecret | quote | b64enc }}
  ### extensibility idp SSO
  mia-realm_mia-identity-provider-client-secret: {{ $secrets.clientSecret | quote | b64enc }}
  mia-realm-extensibility_mia-identity-provider-client-secret: {{ $secrets.clientSecret | quote | b64enc }}
