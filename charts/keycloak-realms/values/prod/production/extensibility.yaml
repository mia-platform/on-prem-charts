# yaml-language-server: $schema=../../../values.schema.json
keycloak-realm-management:
  realmId: mia-realm-extensibility
  realmName: Mia Realm Extensibility
  themes:
    login: mia-platform-keycloak-ui
    account: mia-platform-keycloak-ui
  options:
    isPaaS: true
    cimd: true
  products:
    console: true
  urls:
    keycloak: https://auth.mia-platform.test
    console: https://console.mia-platform.test
  identityProviders:
    - alias: mia-realm
      config:
        authorizationUrl: https://auth.mia-platform.test/realms/mia-platform-development/protocol/openid-connect/auth
        claimFilterName: organization
        claimFilterValue: mia-platform
        clientId: mia-platform-identity-provider
        clientSecret: "${vault.mia-realm_mia-identity-provider-client-secret}"
        defaultScope: "openid email profile organization:*"
        disableUserInfo: "true"
        filteredByClaim: "true"
        isAccessTokenJWT: "true"
        issuer: https://auth.mia-platform.test/realms/mia-realm
        jwksUrl: https://auth.mia-platform.test/realms/mia-realm/protocol/openid-connect/certs
        logoutUrl: https://auth.mia-platform.test/realms/mia-realm/protocol/openid-connect/logout
        pkceEnabled: "true"
        pkceMethod: S256
        sendIdTokenOnLogout: "true"
        syncMode: FORCE
        tokenIntrospectionUrl: https://auth.mia-platform.test/realms/mia-realm/protocol/openid-connect/token/introspect
        tokenUrl: https://auth.mia-platform.test/realms/mia-realm/protocol/openid-connect/token
        useJwksUrl: "true"
        userInfoUrl: https://auth.mia-platform.test/realms/mia-realm/protocol/openid-connect/userinfo
      displayName: Mia-Platform Realm
      enabled: true
      firstBrokerLoginFlowAlias: first broker login
      providerId: oidc
      trustEmail: true
