# yaml-language-server: $schema=./values.schema.json
# You can use the imageCredentials key to generate a new secret where to store the credentials
# to download the images from the Mia-Platform Docker Image Hub. The structure is similar to this:
#
# imageCredentials:
#   name: my-mia-platform-repository
#   registry: nexus.mia-platform.eu
#   username: mia-platform-user
#   password: mia-platform-pwd
#   email: email@mia-platform.test
#
# However it is suggested to create the secret manually and then include a reference using the `imagePullSecrets` key
# like the following:
imagePullSecrets:
  - name: my-mia-platform-repository

mia-console:
  configurations:
    consoleUrl: "https://console.mia-platform.test"
    cmsUrl: "https://cms-console.mia-platform.test"
    audit: {}

    keycloak:
      protocol: "https"
      host: "auth.mia-platform.test"
      realm: "mia-platform"
      extensibilityRealmName: "mia-platform-extensibility"
    enablePrometheusMetrics: false
    ####### uncomment these values only if you want to use gcp as a keyProvider
    ####### however you need an actual GCP infrastructure.
    # crudEncryption:
    #   keyVaultNamespace: 'console.credentials-encryption'
    #   kmsProvider: 'gcp'
    #   gcpConfig:
    #     email: 'kms-user@my-project.iam.gserviceaccount.com'
    #     projectId: 'my-project'
    #     location: 'global'
    #     keyRing: 'my-project-keyring'
    #     keyName: 'my-project'
    #     privateKey: 'my-private-key'
    mailSender:
      senderAddress: "Mia-Platform (no-reply@mia-platform.test)"
      notifier: "smtp"
      smtp:
        host: "email-smtp.eu-west-1.amazonaws.com"
        port: "587"
    redis:
      hosts:
        - ip: redis-master.redis.svc.cluster.local
          port: 6379
      username: default
      tls: true
    assistant:
      enabled: true
      llms:
        - type: azure
          name: gpt-5-mini
          displayName: GPT-5 Mini
          deploymentName: gpt-5-mini
          apiVersion: 2024-12-01-preview
          url: https://openai.azure.com
      embeddings:
        type: "azure"
        apiVersion: "2025-01-01-preview"
        deploymentName: "text-embedding-3-large"
        name: "text-embedding-3-large"
        url: "https://openai.azure.com/"