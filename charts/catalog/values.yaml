# yaml-language-server: $schema=./values.schema.json
catalog:
  url: "https://catalog.mia-platform.test"

  aiServicesClientId: "ai-services-api"

  authzUrl: "https://home.mia-platform.test"

  ingressRoute:
    enabled: true

  catalogKafkaContext:
    topics:
      input: "catalog-events.input"
      output: "catalog-events.output"
    connectionConfig:
      useBootstrapServers: true
      useSaslUsername: false
      useSaslPassword: false
      saslMechanism: PLAIN
      securityProtocol: PLAINTEXT

  authorizationServer:
    issuer: "https://auth.mia-platform.test/realms/mia-realm"

  telemetry:
    enabled: true
    otelExporterOtlpEndpoint: http://opentelemetry-collector.tracing-system.svc.cluster.local:4317
    otelExporterOtlpProtocol: grpc

  secrets:
    accessControlKeys:
      enabled: true
    adkBeAppKeys:
      enabled: true
    authtoolBffKeys:
      enabled: true
    catalogEngineKeys:
      enabled: true
    itemsCompressorKeys:
      enabled: true
    kafkaKeys:
      enabled: true
    mailServiceKeys:
      enabled: true

  apiGateway:
    extraVirtualHosts:
      - "*"
    docling:
      url: "https://ai-services.mia-platform.test/api/docling/"

  accessControl:
    logLevel: debug

  adkBeApp:
    config:
      otelExporterOtlpEndpoint: http://opentelemetry-collector.tracing-system.svc.cluster.local:4318
      otelExporterOtlpProtocol: http/protobuf
      litellmProxyApiBase: "https://ai-services.mia-platform.test/ai-gateway/"
      secretStoreBaseUrl: "https://ai-services.mia-platform.test"

  doclingService:
    enabled: true

  itemsCompressor:
    config:
      kafkaConsumerConfig:
        group.id: cg.catalog.item-compressor-dev
        auto.offset.reset: earliest
        queued.max.messages.kbytes: "32840"
        queued.min.messages: "5000"
      kafkaProducerConfig:
        compression.type: snappy
      postgresConfig:
        cache:
          enabled: true
          tableName: "item_compressor_development_cache"
          schemaName: "items_compressor_development_schema"

  itemsConsumer:
    config:
      kafkaConfig:
        group.id: cg.catalog.items-consumer-dev

  mailService:
    config:
      host: "email-smtp.eu-west-1.amazonaws.com"

  swaggerAggregator:
    enabled: true

  secretStoreService:
    enabled: true
    config:
      storeAddr: "http://openbao.openbao.svc.cluster.local:8200"
      storeKvMount: "secret"
      storeNamespace: "console/production/catalog"
      auth:
        method: "jwt"
        jwt:
          mount: "jwt-console-cluster"
          role: "catalog-production"
